name: SMASH-SIM pipeline

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Comma-separated steps (llm_smoke,ingest,gap_search,seed,screen,fulltext,enrich,compare,views,review_export)"
        default: "ingest,fulltext,enrich,verify,compare,views,review_export"
      limit:
        description: "Max records for enrich/verify/compare (0 = all)"
        default: "0"
      no_llm:
        description: "Skip LLM calls (true/false)"
        default: "false"
  schedule:
    - cron: "17 6 * * 1"   # weekly Monday 06:17 UTC: re-ingest SMASH-BIO and enrich anything new

permissions:
  contents: write

concurrency:
  group: smash-sim-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore full-text cache
        uses: actions/cache@v4
        with:
          path: data/fulltext
          key: fulltext-${{ github.run_id }}
          restore-keys: fulltext-

      - name: Run pipeline
        env:
          NANOGPT_API_KEY: ${{ secrets.NANOGPT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          STEPS="${{ github.event.inputs.steps || 'ingest,fulltext,enrich,verify,compare,views,review_export' }}"
          LIMIT="${{ github.event.inputs.limit }}"
          [ "$LIMIT" = "0" ] && LIMIT=""
          NOLLM="${{ github.event.inputs.no_llm }}"
          ARGS="--steps $STEPS"
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          [ "$NOLLM" = "true" ] && ARGS="$ARGS --no-llm"
          python pipeline/run.py $ARGS

      - name: Commit results
        if: always()
        run: |
          git config user.name "smash-sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git status --short | head -30
          git diff --cached --quiet || git commit -m "pipeline run $(date -u +%Y-%m-%dT%H:%MZ): ${{ github.event.inputs.steps || 'scheduled' }}"
          git pull --rebase -q || true
          git push

      - name: Upload views as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: views-${{ github.run_number }}
          path: |
            data/views
            data/review
            data/prisma_counts.json
          if-no-files-found: ignore

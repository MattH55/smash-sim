name: SMASH-SIM gap search

on:
  workflow_dispatch:
    inputs:
      snowball:
        description: "Also snowball citations from seed cases and enriched records (true/false)"
        default: "true"
  schedule:
    - cron: "41 7 * * 3"   # weekly Wednesday

permissions:
  contents: write

concurrency:
  group: smash-sim-gap-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Search, snowball, screen
        env:
          NANOGPT_API_KEY: ${{ secrets.NANOGPT_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set +e
          python pipeline/ingest_smash.py
          python pipeline/gap_search.py || echo "::warning::gap_search had failures; continuing with what was found"
          if [ "${{ github.event.inputs.snowball || 'true' }}" = "true" ]; then python pipeline/seed.py --snowball --from-records || echo "::warning::snowball had failures"; fi
          python pipeline/screen.py
      - name: Commit candidates
        if: always()
        run: |
          git config user.name "smash-sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "gap search $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push
